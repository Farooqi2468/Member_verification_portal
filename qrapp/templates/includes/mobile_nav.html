<style>
/* ── Mobile Bottom Nav ── */
.mobile-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: #1A1A1A;
    display: flex;
    align-items: stretch;
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 1000;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.25);
}
.mobile-bottom-nav > a, .mobile-bottom-nav > .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 10px;
    font-weight: 500;
    transition: color 0.2s, background 0.2s;
    padding: 6px 2px;
    cursor: pointer;
    background: transparent;
    border: none;
}
.mobile-bottom-nav i {
    font-size: 20px;
    margin-bottom: 4px;
}
.mobile-bottom-nav > a:hover,
.mobile-bottom-nav > .nav-item:hover,
.mobile-bottom-nav > a.active,
.mobile-bottom-nav > .nav-item.active {
    color: #fff;
    background: rgba(255,255,255,0.06);
}
.mobile-bottom-nav > a.active i,
.mobile-bottom-nav > .nav-item.active i {
    color: #C41E3A;
}

/* Dropup specific adjustments */
.mobile-bottom-nav .dropdown-menu {
    background: #1A1A1A;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 0;
    margin-bottom: 8px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
.mobile-bottom-nav .dropdown-header {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 16px;
}
.mobile-bottom-nav .dropdown-item {
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
}
.mobile-bottom-nav .dropdown-item i {
    font-size: 14px;
    margin-right: 8px;
    color: rgba(255,255,255,0.7);
}
.mobile-bottom-nav .dropdown-item:hover,
.mobile-bottom-nav .dropdown-item:active {
    background: rgba(196, 30, 58, 0.15); /* light red hover */
    color: #fff;
}
.mobile-bottom-nav .dropdown-item.active {
    background: #C41E3A;
    color: #fff;
}
.mobile-bottom-nav .dropdown-item.active i {
    color: #fff;
}
</style>

<div class="mobile-bottom-nav d-flex d-md-none">
    <!-- Overview -->
    <a href="{% url 'dashboard' %}" class="{% if active_page == 'dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i>
        <span>Overview</span>
    </a>

    <!-- Members Manager Dropup -->
    <div class="nav-item dropup-center dropup {% if active_page == 'members' or active_page == 'register' %}active{% endif %}">
        <div data-bs-toggle="dropdown" aria-expanded="false" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center;">
            <i class="bi bi-people-fill"></i>
            <span>Members</span>
        </div>
        <ul class="dropdown-menu">
            <li class="dropdown-header">Members Manager</li>
            <li><a class="dropdown-item {% if active_page == 'members' %}active{% endif %}" href="{% url 'all_members' %}"><i class="bi bi-people-fill"></i> All Members</a></li>
            <li><a class="dropdown-item {% if active_page == 'register' %}active{% endif %}" href="{% url 'create_person' %}"><i class="bi bi-person-plus-fill"></i> Register</a></li>
        </ul>
    </div>

    <!-- Users Manager Dropup (Admin Only) -->
    {% if request.user.groups.all.0.name == 'Admin' or request.user.is_superuser %}
    <div class="nav-item dropup-center dropup {% if active_page == 'all_users' or active_page == 'create_user' %}active{% endif %}">
        <div data-bs-toggle="dropdown" aria-expanded="false" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center;">
            <i class="bi bi-person-badge-fill"></i>
            <span>Users</span>
        </div>
        <ul class="dropdown-menu">
            <li class="dropdown-header">Users Manager</li>
            <li><a class="dropdown-item {% if active_page == 'all_users' %}active{% endif %}" href="{% url 'all_system_users' %}"><i class="bi bi-person-lines-fill"></i> All Users</a></li>
            <li><a class="dropdown-item {% if active_page == 'create_user' %}active{% endif %}" href="{% url 'create_system_user' %}"><i class="bi bi-person-badge-fill"></i> Create User</a></li>
        </ul>
    </div>
    {% endif %}

    <!-- System & Setup Dropup -->
    <div class="nav-item dropup-center dropup {% if active_page == 'locations' %}active{% endif %}">
        <div data-bs-toggle="dropdown" aria-expanded="false" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center;">
            <i class="bi bi-gear-fill"></i>
            <span>System</span>
        </div>
        <ul class="dropdown-menu">
            <li class="dropdown-header">System & Setup</li>
            <li><a class="dropdown-item {% if active_page == 'locations' %}active{% endif %}" href="{% url 'manage_locations' %}"><i class="bi bi-geo-alt-fill"></i> Locations</a></li>
            <li><a class="dropdown-item {% if active_page == 'reports' %}active{% endif %}" href="{% url 'reports_view' %}"><i class="bi bi-bar-chart-fill"></i> Reports</a></li>
            <li><a class="dropdown-item {% if active_page == 'settings' %}active{% endif %}" href="{% url 'settings' %}"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
    </div>
</div>
