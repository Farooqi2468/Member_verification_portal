{% extends 'base.html' %}

{% block layout %}
<style>
:root {
  --ppp-red: #C41E3A;
  --ppp-red-dark: #8B1528;
}
.home-d-hero {
    background: linear-gradient(135deg, #1A1A1A 0%, var(--ppp-red-dark) 100%);
    padding: 100px 5vw;
    position: relative;
    overflow: hidden;
    min-height: calc(100vh - 72px);
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.home-d-hero::after {
    content: '';
    position: absolute;
    right: -10vw;
    top: -50px;
    width: 50vw;
    height: 50vw;
    min-width: 400px;
    min-height: 400px;
    border: 2px solid rgba(255,255,255,0.03);
    border-radius: 50%;
}
@media (max-width: 768px) {
    .home-d-hero { padding: 60px 24px; min-height: calc(100vh - 60px); }
    .home-d-hero::after { right: -50px; top: -50px; width: 300px; height: 300px; }
    .home-d-title { font-size: 28px !important; }
    .home-d-desc { font-size: 15px !important; }
}
@media (max-width: 480px) {
    .home-d-hero { padding: 40px 16px; }
    .home-d-title { font-size: 24px !important; }
    .home-d-desc { font-size: 14px !important; }
}
</style>

<div class="container-fluid px-0">
    <div class="home-d-hero">
      <div style="max-width: 680px; z-index: 1; position: relative;">
        <div style="font-size: 13px; color: rgba(255,255,255,0.4); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; font-weight: 600;">Pakistan peoples party</div>
        <div class="home-d-title" style="font-size: 42px; color: #fff; font-weight: 400; line-height: 1.3; margin-bottom: 20px; font-family: 'Georgia', serif;">Lahore urban division<br/>digital urban membership portal</div>
        <div class="home-d-desc" style="font-size: 17px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 40px; max-width: 540px;">Verified QR-coded membership cards for over 125,000 members across all towns, zones, and union councils in Lahore.</div>
        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
          <a href="{% url 'login' %}" style="text-decoration: none; padding: 14px 32px; background: var(--ppp-red); border-radius: 8px; font-size: 15px; color: #fff; font-weight: 500; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">Login</a>
        </div>
      </div>
    </div>
</div>
{% endblock %}
